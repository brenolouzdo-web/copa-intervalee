# Exemplo para VPS (Ubuntu): /etc/nginx/sites-available/copaintervale
server {
    server_name www.copaintervale.com.br;
    listen 80;                      # depois rode: sudo certbot --nginx   (HTTPS é obrigatório p/ PWA e push)

    client_max_body_size 8m;        # uploads de fotos

    location /static/ {
        alias /srv/copa-intervale/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # tempo real (SSE): NÃO pode haver buffer
    location /stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
    }
}
